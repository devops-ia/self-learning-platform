version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    labels:
      - enhancement
      - dependency-management
    assignees:
      - ialejandro
      - amartingarcia
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope
    rebase-strategy: auto
    pull-request-branch-name:
      separator: "-"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    labels:
      - enhancement
      - dependency-management
    ignore:
      - dependency-name: "eslint"
        versions:
          - ">=10"
    groups:
      npm:
        patterns:
          - "*"
    commit-message:
      prefix: fix
      include: scope
    rebase-strategy: auto
    pull-request-branch-name:
      separator: "-"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    labels:
      - enhancement
      - dependency-management
    assignees:
      - ialejandro
      - amartingarcia
    groups:
      docker:
        patterns:
          - "*"
    commit-message:
      prefix: fix
      include: scope
    rebase-strategy: auto
    pull-request-branch-name:
      separator: "-"
